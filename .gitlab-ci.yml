workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - package

include:
  - component: $CI_SERVER_FQDN/gitlabci-components/image-build/build@1.0.2
    inputs:
      name: moodle
      target: moodle-custom
      registry: registry.rz1.metaways.net
      registry_repo: registry.rz1.metaways.net/devops
      registry_user: $REGISTRY_RZ1_USER
      registry_password: $REGISTRY_RZ1_PASSWORD
  - component: $CI_SERVER_FQDN/gitlabci-components/helm-build/build@1.2.1
    inputs:
      name: moodle
