apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "moodle.basename" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "moodle.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.moodle.deployment.replicas }}
  selector:
    matchLabels: {{- include "moodle.matchLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "moodle.labels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/moodle/secret.yaml") . | sha256sum }}
    spec:
      serviceAccount: {{ .Values.serviceAccount }}
      containers:
        - name: moodle

          image: {{ .Values.moodle.deployment.image.repository }}:{{ .Values.moodle.deployment.image.tag }}
          imagePullPolicy: {{ .Values.moodle.deployment.image.imagePullPolicy }}

          {{- if .Values.debug.diagnoseMode.moodle.enabled }}
          command: {{- toYaml .Values.debug.diagnoseMode.moodle.command  | nindent 12 }}
          {{- end}}

          {{- if .Values.moodle.deployment.resources }}
          resources: {{- toYaml .Values.moodle.deployment.resources | nindent 12 }}
          {{- end }}

          {{- define "moodle.envFrom" }}
          envFrom:
            - secretRef:
                name: {{ template "moodle.secret" . }}
          {{- end }}
          {{- include "moodle.envFrom" . }}

          {{- define "moodle.env" }}
          env:
            {{ include "postgresql.env" . | nindent 12 }}
            - name: MOODLE_DBHOST
              value: $(POSTGRES_HOST)
            - name: MOODLE_DBNAME
              value: $(POSTGRES_DB)
            - name: MOODLE_DBUSER
              value: $(POSTGRES_USER)
            - name: MOODLE_DBPASSWORD
              value: $(POSTGRES_PASSWORD)
            # todo: support http ?
            - name: MOODLE_WWWROOT
              value: https://{{ .Values.moodle.ingress.hostname }}
          {{- end }}
          {{- include "moodle.env" . }}

          {{- define "moodle.containerSecurityContext" }}
          securityContext:
            runAsUser: 33
            runAsGroup: 33
          {{- end }}
          {{- include "moodle.containerSecurityContext" . }}

          {{- define "moodle.volumeMounts" }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/moodle
          {{- end }}
          {{- include "moodle.volumeMounts" . }}

      {{- define "moodle.volumes" }}
      volumes:
        - name: data
          persistentVolumeClaim:
              claimName: {{ template "moodle.pvc" . }}
      {{- end }}
      {{- include "moodle.volumes" . }}

      {{- define "moodle.podSecurityContext" }}
      securityContext:
        fsGroup: 150
        fsGroupChangePolicy: OnRootMismatch
      {{- end }}
      {{- include "moodle.podSecurityContext" . }}

      imagePullSecrets:
      {{- if .Values.pullSecret.data }}
        - name: {{ template "moodle.basename" . }}-pull-secret
      {{- end }}
